[project]
name = "evalforge"
version = "0.1.0"
description = "An open-source LLM regression testing and release-decision tool for AI PMs and prompt owners."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "streamlit>=1.30",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"
